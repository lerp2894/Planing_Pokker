<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Poker By LuisRP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-screen" class="screen active">
    <div class="card login-card">
      <h1>🃏 Planning Poker</h1>
      <div class="form-group">
        <label for="userName">Tu nombre</label>
        <input type="text" id="userName" placeholder="Ej: Carlos">
      </div>
      <div class="form-group">
        <label for="roomId">Sala (ID)</label>
        <input type="text" id="roomId" placeholder="Ej: mi-sala">
      </div>
      <div class="form-group">
        <label for="role">Rol inicial</label>
        <select id="role">
          <option value="player">Jugador</option>
          <option value="spectator">Espectador</option>
        </select>
      </div>
      <button id="joinBtn" class="btn-primary">Entrar a la sala</button>
    </div>
  </div>

  <div id="room-screen" class="screen">
    <header>
      <h2 id="roomTitleHeader">Sala: <span id="roomTitle"></span> 
        <span id="moderatorBadge" class="badge" style="display:none;">👑</span>
      </h2>
      <div class="header-controls">
        <div id="timerContainer">
          <span>⏱️</span>
          <span id="sessionTimer">00:00</span>
        </div>
        <button id="leaveRoomBtn" class="btn-leave" title="Salir de la sala">🚪</button>
      </div>
    </header>

    <div class="main-layout">
      <aside id="left-sidebar" class="sidebar left-panel">
        <h3>📊 Analisis</h3>
        <div id="resultsPanel" style="display:none;" class="sidebar-block">
          <p class="analytic-item">Promedio General: <strong id="averageResult">-</strong></p>
          <hr class="separator">
          <div id="summaryAnalytics"></div>
        </div>
        <div id="roleSwitch" class="sidebar-block">
          <button id="toggleRoleBtn" class="btn-secondary">Cambiar a Espectador</button>
        </div>
      </aside>

      <section class="table-area">
        <div class="table-wrapper">
          <div id="pokerTable" class="poker-table">
            <div id="tableStatusLabel" class="table-status-label">Esperando</div>
            <div id="tableAverageDisplay" class="table-average-number">-</div>
          </div>
          <div id="userList" class="users-container"></div>
        </div>
      </section>

      <aside id="sidebar" class="sidebar right-panel">
        <h3>Configuracion</h3>
        <div id="storySection" class="sidebar-block">
          <h4>Historia actual</h4>
          <div id="storyInfo">No hay historia activa.</div>
        </div>

        <button id="clearVotesBtn" class="btn-danger" style="display:none;">Limpiar votos (repetir)</button>

        <div id="moderatorControls" style="display:none;" class="sidebar-block admin-box">
          <h4>Controles Moderador</h4>
          <div class="form-group-admin">
            <input type="text" id="newStoryInput" placeholder="Título de la historia">
            <button id="addStoryBtn" class="btn-secondary">Agregar historia</button>
          </div>
          <div class="threshold-control">
            <label for="thresholdInput">Umbral de alerta:</label>
            <input type="number" id="thresholdInput" value="2" min="0" step="1">
          </div>
        </div>
      </aside>
    </div>

    <footer id="votingPanel" style="display:none;" class="deck-area">
      <div id="cardsContainer" class="cards-deck"></div>
    </footer>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
